[project]
name = "datagouv-slack-agent"
version = "0.1.0"
description = "Agent IA conversationnel Slack pour exploiter data.gouv.fr via MCP"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20",
    "slack-sdk>=3.33",
    "openai>=1.50",
    "mcp>=1.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "duckdb>=1.2",
    "charset-normalizer>=3.3",
    "tavily-python>=0.5",
    "duckduckgo-search>=7.0",
    "matplotlib>=3.9",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "contextily>=1.7",
    "folium>=0.18",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "html5lib>=1.1",
    "tabulate>=0.10.0",
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "aiohttp>=3.9",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=scripts"
